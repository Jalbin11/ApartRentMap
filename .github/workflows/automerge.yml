name: Auto-merge low-risk PRs
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
jobs:
  merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge if labelled automerge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          PR=$(gh pr list --repo "$REPO" --state open --json number,headRefOid,isDraft,labels \
            --jq ".[] | select(.headRefOid==\"$HEAD_SHA\") | select(.isDraft==false) | select([.labels[].name] | index(\"automerge\")) | .number" | head -1)
          if [ -z "$PR" ]; then
            echo "No open, non-draft, automerge-labelled PR at $HEAD_SHA - nothing to do."
            exit 0
          fi
          echo "Merging PR #$PR"
          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
