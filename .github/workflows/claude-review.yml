name: Claude Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Bot-authored PRs are rejected by default; agent PRs need this.
          allowed_bots: "*"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # --allowedTools GRANTS, it does not restrict. Evidence on a real 30-file PR:
          # no flag -> 14 permission denials; inline-tool-only -> 2; so the fix is a
          # COMPLETE list, not a shorter one. Bash is the important addition - the
          # code-review skill needs it to diff the PR.
          claude_args: >-
            --allowedTools
            "Read,Grep,Glob,Bash,mcp__github_inline_comment__create_inline_comment,mcp__github_comment__update_claude_comment"
            --max-turns 40
