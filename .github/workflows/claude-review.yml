name: Claude Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Bot-authored PRs are rejected by default; agent PRs need this.
          allowed_bots: "*"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # NO --allowedTools. Passing an explicit allowlist REPLACED the action's
          # default toolset and starved the reviewer: a 30-file PR went 11 turns ->
          # 4 turns and posted nothing (runs 31994177632, 32001327331). The skill's
          # own frontmatter requests the inline-comment tool; let the defaults stand.
          claude_args: "--max-turns 40"
